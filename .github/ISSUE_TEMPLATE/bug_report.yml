name: Bug report
description: Something is wrong or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The building outline (a screenshot from above helps), the roof settings (/roof info) and the commands you ran.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft, Fabric Loader, Fabric API, Roofwright
      placeholder: 26.3, 0.19.5, 0.162.0+26.3, 1.0.0-beta.1
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Especially claim, permission or block mods (Macaw's Roofs and other roof blocks).
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Paste latest.log or link a paste service.
      render: text
